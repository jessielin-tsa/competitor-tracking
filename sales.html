<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業績整合中心｜蝦皮 × momo × 官網</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 淺色主題。強調色都經過對比度檢查，在 #f4f2ec 底上至少 4.5:1。 */
:root{color-scheme:light;--ink:#f4f2ec;--surface:#ffffff;--surface-2:#eeebe3;--paper:#171b22;--paper-dim:#6d6a63;--rule:rgba(23,27,34,0.11);--rule-strong:rgba(23,27,34,0.22);--brass:#b04e15;--caution:#8a6a0d;--calm:#23655f;--green:#2c7a4f;--violet:#6b46c1;--red:#c0392b;--font-display:'Big Shoulders Display',sans-serif;--font-serif:'Source Serif 4',Georgia,serif;--font-mono:'IBM Plex Mono',monospace;}
*{box-sizing:border-box;}
body{margin:0;background:repeating-linear-gradient(0deg,rgba(23,27,34,0.030) 0px,rgba(23,27,34,0.030) 1px,transparent 1px,transparent 28px),var(--ink);color:var(--paper);font-family:var(--font-serif);min-height:100vh;padding:32px 24px 80px;}
.wrap{max-width:1180px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--rule-strong);padding-bottom:20px;margin-bottom:18px;}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(26px,4.5vw,44px);margin:0 0 4px;line-height:0.95;}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--calm);}
.status-block{text-align:right;font-family:var(--font-mono);font-size:13px;color:var(--paper-dim);}
.scan-time{color:var(--paper);font-size:15px;display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--calm);animation:pulse 2.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(35,101,95,0.45);}70%{box-shadow:0 0 0 7px rgba(35,101,95,0);}100%{box-shadow:0 0 0 0 rgba(35,101,95,0);}}
.navlink{font-family:var(--font-mono);font-size:12px;color:var(--calm);text-decoration:none;border:1px solid var(--rule-strong);padding:6px 12px;border-radius:2px;display:inline-block;margin-top:8px;}
.navlink:hover{background:var(--surface);}
.demo-banner{font-family:var(--font-mono);font-size:12.5px;line-height:1.6;color:#5c4708;background:#fbf0cf;border:1px solid rgba(138,106,13,0.35);border-left:3px solid var(--caution);padding:11px 16px;border-radius:3px;margin-bottom:18px;}
.demo-banner strong{font-weight:600;}
.ctrl{background:var(--surface);border:1px solid var(--rule);padding:16px 18px;margin-bottom:34px;}
.ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ctrl-row+.ctrl-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);}
.row-label{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--paper-dim);margin-right:4px;}
.picker{font-family:var(--font-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--rule-strong);color:var(--paper);padding:9px 14px;border-radius:4px;cursor:pointer;}
.picker:focus-visible,button:focus-visible{outline:2px solid var(--calm);outline-offset:2px;}
.pill{font-family:var(--font-mono);font-size:12px;padding:7px 14px;border:1px solid var(--rule-strong);background:transparent;color:var(--paper-dim);cursor:pointer;border-radius:2px;}
.pill:hover{background:var(--surface-2);}
.pill.active{border-color:var(--brass);color:var(--paper);background:var(--surface-2);}
.cmp-note{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-dim);margin-left:auto;}
.section{margin-bottom:48px;}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.section-head h2{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0;}
.section-head .num{font-family:var(--font-mono);font-size:13px;color:var(--brass);letter-spacing:1px;}
.eyebrow-sm{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--calm);}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:460px){.kpi-grid{grid-template-columns:1fr;}}
.kpi{background:var(--surface);border:1px solid var(--rule);border-top:2px solid var(--rule-strong);padding:16px 18px;}
.kpi .k-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:8px;}
.kpi .k-val{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,2.6vw,32px);line-height:1.05;margin-bottom:8px;white-space:nowrap;letter-spacing:-0.01em;}
.kpi .k-delta{font-family:var(--font-mono);font-size:12px;}
.up{color:var(--green);}.down{color:var(--red);}.flat{color:var(--paper-dim);}
.share-bar{display:flex;height:38px;width:100%;border:1px solid var(--rule-strong);margin-bottom:16px;overflow:hidden;}
.share-seg{display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.plat-card{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--calm);padding:16px 18px;}
.plat-card h3{font-family:var(--font-display);font-weight:700;font-size:21px;margin:0 0 2px;}
.plat-card .share{font-family:var(--font-mono);font-size:12px;color:var(--paper-dim);margin-bottom:12px;}
.plat-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.plat-stats div{font-family:var(--font-mono);font-size:12px;color:var(--paper-dim);}
.plat-stats b{display:block;font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--paper);margin-top:2px;}
.chart-wrap{background:var(--surface);border:1px solid var(--rule);padding:16px 18px;}
.chart{width:100%;height:auto;display:block;}
.chart .axis-label{font-family:var(--font-mono);font-size:10px;fill:var(--paper-dim);}
.chart .gridline{stroke:var(--rule);stroke-width:1;}
.chart .camp-band{fill:rgba(138,106,13,0.13);}
.chart .camp-label{font-family:var(--font-mono);font-size:9px;fill:var(--caution);}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-mono);font-size:12px;color:var(--paper-dim);margin-top:12px;}
.legend span{display:flex;align-items:center;gap:6px;}
.swatch{width:11px;height:11px;border-radius:2px;display:inline-block;}
.camp-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}
.camp-card{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--caution);padding:16px 18px;}
.camp-card h3{font-family:var(--font-serif);font-weight:600;font-size:16px;margin:0 0 4px;}
.camp-card .camp-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-dim);margin-bottom:12px;}
.camp-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:10px;}
.camp-stats div{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-dim);}
.camp-stats b{display:block;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--paper);margin-top:2px;}
.camp-card .lift{font-size:13px;line-height:1.55;color:var(--paper);border-top:1px solid var(--rule);padding-top:10px;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);}
table.data{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12.5px;min-width:660px;}
table.data th,table.data td{padding:10px 13px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap;}
table.data th:first-child,table.data td:first-child{text-align:left;}
table.data thead th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);background:var(--surface);border-bottom:1px solid var(--rule-strong);position:sticky;top:0;}
table.data tbody tr:hover td{background:rgba(23,27,34,0.035);}
table.data tfoot td{font-weight:600;color:var(--paper);background:var(--surface);border-top:1px solid var(--rule-strong);}
.tbl-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.empty-state{font-family:var(--font-mono);font-size:13px;color:var(--paper-dim);padding:28px;border:1px dashed var(--rule-strong);text-align:center;line-height:1.7;}
.fatal{background:var(--surface);border:1px solid var(--rule-strong);border-left:4px solid var(--brass);padding:22px 26px;margin-bottom:24px;}
.fatal h2{font-family:var(--font-display);font-size:22px;margin:0 0 12px;color:var(--brass);}
.fatal p,.fatal li{font-size:14.5px;line-height:1.7;margin:0 0 10px;}
.fatal ol{margin:0;padding-left:22px;}
.fatal li{margin-bottom:8px;}
.fatal code{font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:3px;overflow-wrap:anywhere;}
.fatal-tech{font-family:var(--font-mono);font-size:11.5px;color:var(--paper-dim);border-top:1px solid var(--rule);padding-top:10px;margin-bottom:0;}
footer{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule);font-family:var(--font-mono);font-size:11px;color:var(--paper-dim);line-height:1.7;}
@media(max-width:640px){.status-block{text-align:left;}header{align-items:flex-start;}.cmp-note{margin-left:0;}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow">MULTI-CHANNEL SALES CENTER</div>
    <h1>業績整合中心</h1>
    <a class="navlink" href="./index.html">← 競品分析中心</a>
  </div>
  <div class="status-block">
    <div class="scan-time"><span class="pulse"></span><span id="lastUpdated">—</span> 最後同步</div>
    <div id="coverLine">載入中...</div>
  </div>
</header>

<div id="demoBanner" style="display:none" class="demo-banner"></div>

<div class="ctrl">
  <div class="ctrl-row">
    <span class="row-label">期間</span>
    <input type="date" class="picker" id="rangeFrom">
    <span class="row-label" style="margin:0">至</span>
    <input type="date" class="picker" id="rangeTo">
    <span class="cmp-note" id="cmpNote"></span>
  </div>
  <div class="ctrl-row" id="quickRow">
    <span class="row-label">快捷</span>
  </div>
</div>

<section class="section">
  <div class="section-head"><span class="num">01</span><h2>期間總覽</h2><span class="eyebrow-sm">PERIOD SUMMARY</span></div>
  <div class="kpi-grid" id="kpiGrid"></div>
</section>

<section class="section">
  <div class="section-head"><span class="num">02</span><h2>三平台佔比</h2><span class="eyebrow-sm">CHANNEL MIX</span></div>
  <div class="share-bar" id="shareBar"></div>
  <div class="plat-grid" id="platGrid"></div>
</section>

<section class="section">
  <div class="section-head"><span class="num">03</span><h2>每日趨勢</h2><span class="eyebrow-sm">DAILY TREND</span></div>
  <div class="ctrl-row" id="metricRow" style="margin-bottom:14px"><span class="row-label">指標</span></div>
  <div class="chart-wrap">
    <svg class="chart" id="trendChart" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" id="trendLegend"></div>
  </div>
</section>

<section class="section">
  <div class="section-head"><span class="num">04</span><h2>活動檔期成效</h2><span class="eyebrow-sm">CAMPAIGN LIFT</span></div>
  <div class="camp-list" id="campList"></div>
</section>

<section class="section">
  <div class="section-head"><span class="num">05</span><h2>逐日明細</h2><span class="eyebrow-sm">DAILY BREAKDOWN</span></div>
  <div class="tbl-actions">
    <button class="pill" id="dlBtn">⬇ 下載本期 CSV</button>
    <span class="row-label" id="rowCount" style="margin:0;text-transform:none"></span>
  </div>
  <div class="tbl-wrap"><table class="data">
    <thead><tr id="dataHead"></tr></thead>
    <tbody id="dataBody"></tbody>
    <tfoot id="dataFoot"></tfoot>
  </table></div>
</section>

<footer id="footNote"></footer>
</div>

<script>
"use strict";
// 圖表配色直接讀 :root 的 CSS 變數，換主題時只要改一處
const ACCENT=(()=>{
  const cs=getComputedStyle(document.documentElement);
  const pick=(n,fb)=>(cs.getPropertyValue('--'+n).trim()||fb);
  return {brass:pick('brass','#b04e15'),calm:pick('calm','#23655f'),
          violet:pick('violet','#6b46c1'),green:pick('green','#2c7a4f'),
          caution:pick('caution','#8a6a0d')};
})();
const METRICS=[
  {id:'revenue', label:'營業額', stack:true,  fmt:v=>fmtMoney(v)},
  {id:'orders',  label:'訂單數', stack:true,  fmt:v=>fmtNum(v)},
  {id:'adSpend', label:'廣告花費',stack:true, fmt:v=>fmtMoney(v)},
  {id:'roas',    label:'ROAS',   stack:false, fmt:v=>v.toFixed(2)},
];
let DATA=null, FROM=null, TO=null, METRIC='revenue';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(v){return '$'+Math.round(v).toLocaleString('en-US');}
function fmtNum(v){return Math.round(v).toLocaleString('en-US');}
function fmtCompact(v){
  const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toFixed(1)+'億';
  if(a>=1e4) return (v/1e4).toFixed(a>=1e6?0:1)+'萬';
  return Math.round(v).toLocaleString('en-US');
}
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1;}

// ---- 彙總 ----
function emptyAgg(){return {revenue:0,orders:0,adSpend:0,adRevenue:0};}
function accumulate(t,r){t.revenue+=r.revenue||0;t.orders+=r.orders||0;t.adSpend+=r.adSpend||0;t.adRevenue+=r.adRevenue||0;return t;}
function derive(t){
  return Object.assign({},t,{
    aov: t.orders>0 ? t.revenue/t.orders : 0,
    roas: t.adSpend>0 ? t.adRevenue/t.adSpend : 0,
    adRatio: t.revenue>0 ? t.adSpend/t.revenue : 0,
  });
}
function rowsIn(from,to,platforms){
  return DATA.daily.filter(r=>r.date>=from&&r.date<=to&&(!platforms||platforms.includes(r.platform)));
}
function aggregate(rows){return derive(rows.reduce(accumulate,emptyAgg()));}

function deltaHtml(cur,prev,invert){
  if(!prev){return '<span class="flat">前期無資料</span>';}
  const pct=(cur-prev)/Math.abs(prev)*100;
  const good=invert ? pct<0 : pct>0;
  const cls=Math.abs(pct)<0.05?'flat':(good?'up':'down');
  const sign=pct>0?'▲':(pct<0?'▼':'—');
  return `<span class="${cls}">${sign} ${Math.abs(pct).toFixed(1)}% vs 前期</span>`;
}

// ---- 渲染 ----
function renderKpis(cur,prev){
  const items=[
    {label:'總營業額', val:fmtMoney(cur.revenue), c:cur.revenue, p:prev.revenue},
    {label:'訂單數',   val:fmtNum(cur.orders),    c:cur.orders,  p:prev.orders},
    {label:'平均客單價',val:fmtMoney(cur.aov),    c:cur.aov,     p:prev.aov},
    {label:'廣告花費', val:fmtMoney(cur.adSpend), c:cur.adSpend, p:prev.adSpend, invert:true},
    {label:'整體 ROAS',val:cur.roas.toFixed(2),   c:cur.roas,    p:prev.roas},
    {label:'廣告佔營收',val:(cur.adRatio*100).toFixed(1)+'%',c:cur.adRatio,p:prev.adRatio,invert:true},
  ];
  document.getElementById('kpiGrid').innerHTML=items.map(i=>`
    <div class="kpi">
      <div class="k-label">${esc(i.label)}</div>
      <div class="k-val">${esc(i.val)}</div>
      <div class="k-delta">${deltaHtml(i.c,i.p,i.invert)}</div>
    </div>`).join('');
}

function renderPlatforms(cur){
  const bar=document.getElementById('shareBar'), grid=document.getElementById('platGrid');
  const total=cur.revenue;
  const per=DATA.platforms.map(p=>{
    const a=aggregate(rowsIn(FROM,TO,[p.id]));
    const prevRange=prevPeriod();
    const b=aggregate(rowsIn(prevRange.from,prevRange.to,[p.id]));
    return {p,a,b,share:total>0?a.revenue/total:0};
  });
  bar.innerHTML=per.filter(x=>x.share>0.0001).map(x=>
    `<div class="share-seg" style="width:${(x.share*100).toFixed(2)}%;background:${ACCENT[x.p.accent]||ACCENT.calm}"
      title="${esc(x.p.label)} ${(x.share*100).toFixed(1)}%">${x.share>0.07?esc(x.p.label)+' '+(x.share*100).toFixed(0)+'%':''}</div>`
  ).join('')||'<div class="share-seg" style="width:100%;background:var(--surface-2);color:var(--paper-dim)">本期無資料</div>';

  grid.innerHTML=per.map(x=>`
    <div class="plat-card" style="border-left-color:${ACCENT[x.p.accent]||ACCENT.calm}">
      <h3 style="color:${ACCENT[x.p.accent]||ACCENT.calm}">${esc(x.p.label)}</h3>
      <div class="share">佔總營收 ${(x.share*100).toFixed(1)}%　${deltaHtml(x.a.revenue,x.b.revenue)}</div>
      <div class="plat-stats">
        <div>營業額<b>${fmtMoney(x.a.revenue)}</b></div>
        <div>訂單數<b>${fmtNum(x.a.orders)}</b></div>
        <div>客單價<b>${fmtMoney(x.a.aov)}</b></div>
        <div>ROAS<b>${x.a.roas>0?x.a.roas.toFixed(2):'—'}</b></div>
      </div>
    </div>`).join('');
}

function seriesFor(metric){
  const dates=[];
  for(let d=FROM;d<=TO;d=addDays(d,1))dates.push(d);
  const byKey=new Map();
  rowsIn(FROM,TO).forEach(r=>byKey.set(r.date+'|'+r.platform,r));
  return DATA.platforms.map(p=>({
    p,
    values:dates.map(d=>{
      const r=byKey.get(d+'|'+p.id);
      if(!r)return 0;
      if(metric==='roas')return (r.adSpend>0)?(r.adRevenue/r.adSpend):0;
      return r[metric]||0;
    })
  }));
}

function renderTrend(){
  const svg=document.getElementById('trendChart');
  const m=METRICS.find(x=>x.id===METRIC);
  const dates=[];for(let d=FROM;d<=TO;d=addDays(d,1))dates.push(d);
  const series=seriesFor(METRIC);
  const W=1000,H=300,padL=64,padR=14,padT=16,padB=34;
  const iw=W-padL-padR, ih=H-padT-padB;
  if(!dates.length){svg.innerHTML='';return;}

  let max=0;
  if(m.stack){
    dates.forEach((_,i)=>{max=Math.max(max,series.reduce((s,x)=>s+x.values[i],0));});
  }else{
    series.forEach(x=>x.values.forEach(v=>{max=Math.max(max,v);}));
  }
  if(max<=0)max=1;
  max=max*1.08;
  const x=i=>padL+(dates.length===1?iw/2:iw*i/(dates.length-1));
  const y=v=>padT+ih-(v/max)*ih;

  let g='';
  // y 軸格線
  for(let k=0;k<=4;k++){
    const v=max*k/4, yy=y(v);
    g+=`<line class="gridline" x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}"/>`;
    g+=`<text class="axis-label" x="${padL-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${esc(METRIC==='roas'?v.toFixed(1):fmtCompact(v))}</text>`;
  }
  // 檔期底色
  (DATA.campaigns||[]).forEach(c=>{
    const s=c.from>FROM?c.from:FROM, e=c.to<TO?c.to:TO;
    if(s>e)return;
    const i1=dates.indexOf(s), i2=dates.indexOf(e);
    if(i1<0||i2<0)return;
    const x1=x(i1), x2=x(i2), w=Math.max(x2-x1,3);
    g+=`<rect class="camp-band" x="${x1.toFixed(1)}" y="${padT}" width="${w.toFixed(1)}" height="${ih}"/>`;
    g+=`<text class="camp-label" x="${(x1+2).toFixed(1)}" y="${padT+11}">${esc(c.label)}</text>`;
  });

  if(m.stack){
    // 堆疊面積
    const cum=dates.map(()=>0);
    series.forEach(s=>{
      const top=[],bot=[];
      dates.forEach((_,i)=>{bot.push(cum[i]);cum[i]+=s.values[i];top.push(cum[i]);});
      const up=top.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      const dn=bot.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).reverse().join(' ');
      const col=ACCENT[s.p.accent]||ACCENT.calm;
      g+=`<polygon points="${up} ${dn}" fill="${col}" fill-opacity="0.5" stroke="${col}" stroke-width="1.2"/>`;
    });
  }else{
    series.forEach(s=>{
      const col=ACCENT[s.p.accent]||ACCENT.calm;
      const pts=s.values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      g+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/>`;
    });
  }

  // x 軸日期
  const step=Math.max(1,Math.ceil(dates.length/8));
  dates.forEach((d,i)=>{
    if(i%step!==0 && i!==dates.length-1)return;
    g+=`<text class="axis-label" x="${x(i).toFixed(1)}" y="${H-12}" text-anchor="middle">${esc(d.slice(5))}</text>`;
  });
  svg.innerHTML=g;

  document.getElementById('trendLegend').innerHTML=
    DATA.platforms.map(p=>`<span><i class="swatch" style="background:${ACCENT[p.accent]||ACCENT.calm}"></i>${esc(p.label)}</span>`).join('')
    +`<span style="color:var(--caution)"><i class="swatch" style="background:rgba(138,106,13,0.30)"></i>活動檔期</span>`;
}

function renderCampaigns(){
  const el=document.getElementById('campList');
  const list=(DATA.campaigns||[]).filter(c=>c.from<=TO&&c.to>=FROM)
    .sort((a,b)=>a.from<b.from?1:-1);
  if(!list.length){
    el.innerHTML='<div class="empty-state">所選期間內沒有標記的活動檔期。<br>檔期定義在 <code>sales-data.json</code> 的 <code>campaigns</code> 陣列。</div>';
    return;
  }
  el.innerHTML=list.map(c=>{
    const plats=c.platforms&&c.platforms.length?c.platforms:DATA.platforms.map(p=>p.id);
    const days=daysBetween(c.from,c.to);
    const inCamp=aggregate(rowsIn(c.from,c.to,plats));
    // 基準：檔期前 14 天，扣掉落在其他檔期內的日子
    const bFrom=addDays(c.from,-14), bTo=addDays(c.from,-1);
    const otherCamps=(DATA.campaigns||[]).filter(o=>o.id!==c.id);
    const baseRows=rowsIn(bFrom,bTo,plats).filter(r=>!otherCamps.some(o=>{
      const op=o.platforms&&o.platforms.length?o.platforms:DATA.platforms.map(p=>p.id);
      return op.includes(r.platform)&&r.date>=o.from&&r.date<=o.to;
    }));
    const baseDays=new Set(baseRows.map(r=>r.date)).size;
    const base=aggregate(baseRows);
    const campDaily=days>0?inCamp.revenue/days:0;
    const baseDaily=baseDays>0?base.revenue/baseDays:0;
    const lift=baseDaily>0?campDaily/baseDaily:null;
    const incremental=baseDaily>0?(campDaily-baseDaily)*days:null;
    const partial=(c.from<FROM||c.to>TO);
    const platLabels=plats.map(id=>{const p=DATA.platforms.find(z=>z.id===id);return p?p.label:id;}).join('、');
    return `
    <div class="camp-card">
      <h3>${esc(c.label)}</h3>
      <div class="camp-meta">${esc(c.from)} → ${esc(c.to)}　${days} 天　${esc(platLabels)}${partial?'　<span style="color:var(--caution)">⚠ 部分落在所選期間外</span>':''}</div>
      <div class="camp-stats">
        <div>檔期總營收<b>${fmtMoney(inCamp.revenue)}</b></div>
        <div>檔期日均<b>${fmtMoney(campDaily)}</b></div>
        <div>檔期訂單<b>${fmtNum(inCamp.orders)}</b></div>
        <div>檔期 ROAS<b>${inCamp.roas>0?inCamp.roas.toFixed(2):'—'}</b></div>
      </div>
      <div class="lift">${
        lift==null
        ? '檔期前 14 天無可用基準資料，無法計算拉抬倍數。'
        : `對比檔期前 14 天日均 <b>${fmtMoney(baseDaily)}</b>，拉抬 <b style="color:${lift>=1?'var(--green)':'var(--red)'}">${lift.toFixed(2)}×</b>，估算增額營收 <b style="color:${incremental>=0?'var(--green)':'var(--red)'}">${fmtMoney(incremental)}</b>。`
      }</div>
    </div>`;
  }).join('');
}

function renderTable(){
  const head=document.getElementById('dataHead');
  head.innerHTML=['日期'].concat(DATA.platforms.map(p=>p.label+' 營收'))
    .concat(['當日合計','訂單','廣告費','ROAS']).map(h=>`<th>${esc(h)}</th>`).join('');
  const dates=[];for(let d=TO;d>=FROM;d=addDays(d,-1))dates.push(d);
  const byKey=new Map();
  rowsIn(FROM,TO).forEach(r=>byKey.set(r.date+'|'+r.platform,r));
  const body=dates.map(d=>{
    const cells=DATA.platforms.map(p=>{const r=byKey.get(d+'|'+p.id);return r?r.revenue:0;});
    const dayRows=DATA.platforms.map(p=>byKey.get(d+'|'+p.id)).filter(Boolean);
    const a=aggregate(dayRows);
    return `<tr><td>${esc(d)}</td>${cells.map(v=>`<td>${v?fmtMoney(v):'—'}</td>`).join('')}
      <td>${fmtMoney(a.revenue)}</td><td>${fmtNum(a.orders)}</td><td>${fmtMoney(a.adSpend)}</td>
      <td>${a.roas>0?a.roas.toFixed(2):'—'}</td></tr>`;
  }).join('');
  document.getElementById('dataBody').innerHTML=body||`<tr><td colspan="${DATA.platforms.length+5}" style="text-align:center;color:var(--paper-dim);padding:24px">本期無資料</td></tr>`;
  const tot=aggregate(rowsIn(FROM,TO));
  const perPlat=DATA.platforms.map(p=>aggregate(rowsIn(FROM,TO,[p.id])).revenue);
  document.getElementById('dataFoot').innerHTML=`<tr><td>合計</td>${perPlat.map(v=>`<td>${fmtMoney(v)}</td>`).join('')}
    <td>${fmtMoney(tot.revenue)}</td><td>${fmtNum(tot.orders)}</td><td>${fmtMoney(tot.adSpend)}</td>
    <td>${tot.roas>0?tot.roas.toFixed(2):'—'}</td></tr>`;
  document.getElementById('rowCount').textContent=`${dates.length} 天 · ${rowsIn(FROM,TO).length} 筆平台紀錄`;
}

function downloadCsv(){
  const rows=rowsIn(FROM,TO).slice().sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:a.platform.localeCompare(b.platform)));
  const labelOf=id=>{const p=DATA.platforms.find(z=>z.id===id);return p?p.label:id;};
  const lines=[['日期','平台','營業額','訂單數','廣告花費','廣告營收','客單價','ROAS'].join(',')];
  rows.forEach(r=>{
    const aov=r.orders>0?(r.revenue/r.orders).toFixed(0):'';
    const roas=r.adSpend>0?(r.adRevenue/r.adSpend).toFixed(2):'';
    lines.push([r.date,labelOf(r.platform),r.revenue,r.orders,r.adSpend,r.adRevenue,aov,roas].join(','));
  });
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`業績整合_${FROM}_至_${TO}.csv`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function prevPeriod(){
  const n=daysBetween(FROM,TO);
  return {from:addDays(FROM,-n), to:addDays(FROM,-1), n};
}

function renderAll(){
  if(FROM>TO){const t=FROM;FROM=TO;TO=t;
    document.getElementById('rangeFrom').value=FROM;
    document.getElementById('rangeTo').value=TO;}
  const cur=aggregate(rowsIn(FROM,TO));
  const pp=prevPeriod();
  const prev=aggregate(rowsIn(pp.from,pp.to));
  document.getElementById('cmpNote').textContent=`本期 ${pp.n} 天 · 對照前期 ${pp.from} → ${pp.to}`;
  renderKpis(cur,prev);
  renderPlatforms(cur);
  renderTrend();
  renderCampaigns();
  renderTable();
  try{localStorage.setItem('salesRange',JSON.stringify({from:FROM,to:TO}));}catch(e){}
}

function setRange(from,to){
  const lo=DATA.bounds.min, hi=DATA.bounds.max;
  FROM=from<lo?lo:from; TO=to>hi?hi:to;
  if(FROM>TO)FROM=TO;
  document.getElementById('rangeFrom').value=FROM;
  document.getElementById('rangeTo').value=TO;
  renderAll();
}

function buildQuickRow(){
  const hi=DATA.bounds.max, lo=DATA.bounds.min;
  const monthStart=hi.slice(0,8)+'01';
  const prevMonthEnd=addDays(monthStart,-1);
  const prevMonthStart=prevMonthEnd.slice(0,8)+'01';
  const presets=[
    {label:'近 7 天',  from:addDays(hi,-6),  to:hi},
    {label:'近 14 天', from:addDays(hi,-13), to:hi},
    {label:'近 30 天', from:addDays(hi,-29), to:hi},
    {label:'本月',     from:monthStart,      to:hi},
    {label:'上月',     from:prevMonthStart,  to:prevMonthEnd},
    {label:'全部',     from:lo,              to:hi},
  ];
  const row=document.getElementById('quickRow');
  presets.forEach(p=>{
    const b=document.createElement('button');
    b.className='pill'; b.textContent=p.label;
    b.addEventListener('click',()=>{setRange(p.from,p.to);markActive(row,b);});
    row.appendChild(b);
  });
}
function markActive(row,btn){
  row.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
}

function buildMetricRow(){
  const row=document.getElementById('metricRow');
  METRICS.forEach(m=>{
    const b=document.createElement('button');
    b.className='pill'+(m.id===METRIC?' active':'');
    b.textContent=m.label;
    b.addEventListener('click',()=>{METRIC=m.id;markActive(row,b);renderTrend();});
    row.appendChild(b);
  });
}

// 讀不到資料時，把空的區塊全部收起來，並把說明放在最上面——
// 否則使用者只會看到一整頁有標題、沒內容的空殼，而提示藏在頁尾。
function fatal(title, body){
  document.querySelectorAll('.section, .ctrl').forEach(el=>{el.style.display='none';});
  document.getElementById('coverLine').textContent='資料未載入';
  document.getElementById('lastUpdated').textContent='—';
  document.querySelector('header').insertAdjacentHTML('afterend',
    `<div class="fatal"><h2>${title}</h2>${body}</div>`);
}

async function init(){
  let d;
  const isFile=location.protocol==='file:';
  try{
    const r=await fetch('./sales-data.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    d=await r.json();
  }catch(e){
    fatal('讀不到資料檔 sales-data.json', isFile
      ? `<p>你是用<b>檔案總管直接雙擊</b>開啟這個網頁的。瀏覽器基於安全限制，
         這種開法不允許網頁讀取旁邊的資料檔，所以畫面才是空的。<b>這跟 Google 權限無關。</b></p>
         <p>三種可行的開法：</p>
         <ol>
           <li><b>用 GitHub Pages</b>（最方便，手機也能看）—— 設定好之後用網址開</li>
           <li><b>在本機開個小網站</b>：在放這些檔案的資料夾裡執行
               <code>python3 -m http.server 8000</code>，然後開
               <code>http://localhost:8000/sales.html</code></li>
           <li><b>用單檔版本</b>：資料直接內嵌在 HTML 裡的那一份，雙擊就能開</li>
         </ol>`
      : `<p>網頁本身載入成功，但同資料夾裡找不到 <code>sales-data.json</code>，
         或它的內容不是合法的 JSON。<b>這跟 Google 權限無關</b>——
         網頁只讀這個檔案，不會去連 Google。</p>
         <p>請確認 <code>sales.html</code> 和 <code>sales-data.json</code>
         放在<b>同一個資料夾</b>裡。</p>
         <p class="fatal-tech">技術訊息：${esc(e.message)}</p>`);
    return;
  }
  DATA=d;
  DATA.daily=(DATA.daily||[]).filter(r=>r&&r.date&&r.platform);
  if(!DATA.platforms||!DATA.platforms.length){DATA.platforms=[];}
  if(!DATA.daily.length){
    fatal('資料檔讀到了，但裡面沒有任何業績紀錄',
      `<p><code>sales-data.json</code> 的 <code>daily</code> 是空的。</p>
       <p>如果你已經設定好三份 Google Sheet 的同步，代表同步還沒成功跑過一次。
       到 GitHub 的 <b>Actions → Sync sales data</b> 看最近一次執行的報告，
       上面會列出每份表的讀取結果與失敗原因。</p>`);
    return;
  }
  const ds=DATA.daily.map(r=>r.date).sort();
  DATA.bounds={min:ds[0],max:ds[ds.length-1]};

  document.getElementById('lastUpdated').textContent=DATA.updatedAt||DATA.bounds.max;
  document.getElementById('coverLine').textContent=`資料涵蓋 ${DATA.bounds.min} → ${DATA.bounds.max}`;
  if(DATA.isDemo){
    const b=document.getElementById('demoBanner');
    b.style.display='block';
    b.innerHTML='<strong>⚠ 目前顯示的是示範資料，不是真實業績。</strong> 設定好 <code>scripts/sales-sources.json</code> 的欄位對應並成功同步一次後，此橫幅會自動消失。';
  }
  document.getElementById('footNote').innerHTML=
    `資料來源：sales-data.json（${esc(String(DATA.daily.length))} 筆平台日紀錄）。`
    +`幣別 ${esc(DATA.currency||'TWD')}。ROAS = 廣告營收 ÷ 廣告花費。`
    +`檔期拉抬倍數 = 檔期日均營收 ÷ 檔期前 14 天日均營收（已排除與其他檔期重疊的日子）。`;

  const fromEl=document.getElementById('rangeFrom'), toEl=document.getElementById('rangeTo');
  fromEl.min=toEl.min=DATA.bounds.min;
  fromEl.max=toEl.max=DATA.bounds.max;

  buildQuickRow();
  buildMetricRow();

  let init0={from:addDays(DATA.bounds.max,-29),to:DATA.bounds.max};
  try{
    const saved=JSON.parse(localStorage.getItem('salesRange')||'null');
    if(saved&&saved.from&&saved.to)init0=saved;
  }catch(e){}
  setRange(init0.from,init0.to);

  fromEl.addEventListener('change',()=>{if(fromEl.value){FROM=fromEl.value;markActive(document.getElementById('quickRow'),null);renderAll();}});
  toEl.addEventListener('change',()=>{if(toEl.value){TO=toEl.value;markActive(document.getElementById('quickRow'),null);renderAll();}});
  document.getElementById('dlBtn').addEventListener('click',downloadCsv);
}
init();
</script>
