name: Auto-merge claude branches
on:
  push:
    branches:
      - 'claude/**'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate JSON files
        run: |
          git checkout ${GITHUB_REF_NAME}
          for f in tracking-data.json tracking-history.json price-history.json; do
            if [ -f "$f" ]; then python3 -m json.tool "$f" > /dev/null || exit 1; fi
          done
      - name: Merge into main and delete branch
        run: |
          git config user.name "auto-merge-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout main
          if git merge --no-ff ${GITHUB_REF_NAME} -m "Auto-merge ${GITHUB_REF_NAME}"; then
            echo "Clean merge."
          else
            echo "Merge conflict — trying safe auto-resolve for append-only data files."
            conflicts=$(git diff --name-only --diff-filter=U)
            allowed="price-history.json tracking-history.json"
            for f in $conflicts; do
              case " $allowed " in
                *" $f "*) ;;
                *) echo "Unresolvable conflict in $f — aborting for human review."; git merge --abort; exit 1;;
              esac
            done
            python3 scripts/merge_price_history.py $conflicts || { git merge --abort; exit 1; }
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Conflicts remain after auto-resolve — aborting."; git merge --abort; exit 1
            fi
            for f in tracking-data.json tracking-history.json price-history.json; do
              if [ -f "$f" ]; then python3 -m json.tool "$f" > /dev/null || { git merge --abort; exit 1; }; fi
            done
            git commit --no-edit
          fi
          git push origin main
          git push origin --delete ${GITHUB_REF_NAME}
