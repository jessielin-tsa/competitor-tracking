name: Sync sales data

on:
  schedule:
    # 每天 02:00 UTC = 台北時間 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      inspect:
        description: '只檢查欄位對應，不寫檔（第一次設定時用這個）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-sales
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 兩種模式都會把欄位對應表寫進 $GITHUB_STEP_SUMMARY，
      # 直接顯示在這次執行的頁面上，不必翻 log。
      - name: Inspect sheet columns
        if: ${{ inputs.inspect }}
        run: python3 scripts/sync_sales.py --inspect

      - name: Sync sales data
        if: ${{ !inputs.inspect }}
        run: python3 scripts/sync_sales.py

      - name: Validate JSON
        if: ${{ !inputs.inspect }}
        run: python3 -m json.tool sales-data.json > /dev/null

      - name: Commit if changed
        if: ${{ !inputs.inspect }}
        run: |
          if git diff --quiet -- sales-data.json; then
            echo "sales-data.json 無變化，不建立 commit。"
            exit 0
          fi
          git config user.name "sales-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sales-data.json
          git commit -m "業績同步 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push 失敗，第 $i 次重試..."
            sleep $((2 ** i))
          done
          exit 1
